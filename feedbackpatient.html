<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #be6dcd;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        /* Main container styling */
        .container {
            margin-left: 250px;
            width: 95%;
            max-width: 700px;
            padding: 30px;
            background-color: #e6bfee;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        /* Page title styling */
        h1 {
            color: #190439;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        /* Subheading text */
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        /* Feedback form styling */
        form {
            margin-left: 50px;
            margin-bottom: 30px;
            text-align: left;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #501e73;
            color: rgb(216, 154, 228);
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #491761;
        }

        /* Feedback display styling */
        .feedback-list {
            margin-left: 50px;
            text-align: left;
            margin-top: 20px;
        }

        .feedback-item {
            background-color: #d28be0;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .feedback-item h3 {
            margin: 0 0 5px;
            color: #321056;
        }

        .feedback-item p {
            margin: 5px 0;
            color: #555;
        }

        .feedback-item .rating {
            font-weight: bold;
            color: #333;
        }
        #feedbackForm {
    display: flex;
    flex-direction: column; /* Arrange elements vertically */
    align-items: center;    /* Center-align elements */
    width: 500px;           /* Increased width from 300px to 500px */
    margin: 20px auto;      /* Center the form horizontally on the page */
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background-color: #f9f9f9;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

        *{
    margin:0;
    padding: 0;
}
.main{
    width: 100%;
    background: linear-gradient(to top,rgba(179, 195, 239, 0) 10%, rgba(146, 156, 240, 0) 10%), url(hospital.jpg);
    background-position: center;
    background-size: cover;
    height: 109vh;
}
.navbar{
    width: 1200px;
    height:75px;
    margin:auto;
}
.icon{
    width: 200px;
    float:left;
    height: 70px;
}
.logo{
    color: rgb(7, 7, 51);
    font-size:35px;
    font-family:Arial, Helvetica, sans-serif;
    padding-left: 20px;
    float: left;
    padding-top: 10px;
}
.menu{
    width: 400px;
    float: left;
    height:70px;

}
ul{
    float: left;
    display:flex;
    justify-content: center;
    align-items: center;
}
ul li{
    list-style: none;
    margin-left: 62px;
    margin-top: 27px;
    font-size: 14px;
}
ul li a{
    text-decoration: none;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    transition: 0.4s ease-in-out;
}

ul li a:hover{
    color: blueviolet;
}
.search{
    width: 330px;
    float: left;
    margin-left: 270px;

}
.srch{
    font-family: 'Times New Roman', Times, serif;
    width: 200px;
    height: 40px;
    background: transparent;
    border: 1px solid rgb(244, 244, 250);
    margin-top: 13px;
    color:white;
    border-right: none ;
    font-size: 16px;
    float: left;
    padding: 10px;
    border-bottom-left-radius: 5px;
    border-top-left-radius: 5px;
}
.btn{
    width:100px;
    height: 40px;
    background: rgb(180, 214, 240);
    border: 2px solid  rgb(180, 214, 240);
    margin-top: 13px;
    color: white;
    font-size: 15px;
    border-bottom-right-radius: 5px;
    border-bottom-right-radius: 5px;

}

.btn:focus{
    outline: none;
}
.srch:focus{
    outline:none;
}
    </style>
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="icon">
                <h2 class="logo">MyHospital</h2>
            </div>

            <div class="menu">
                <ul>
                    <li><a href="homepage.html">Home</a></li>
                    <li><a href="aboutpage.html">About</a></li>
                    <li><a href="feedbackpatient.html">Contact</a></li>
                </ul>
            </div>
            <div class="search">
                <input class="srch" type="search" name="" placeholder="Type">
                <a href="#"> <button class="btn">Search</button></a>
            </div>
        </div>
    <div class="container">
        <h1>Customer Feedback</h1>
        <p>We value your feedback! Please fill out the form below.</p>

        <!-- Feedback Form -->
        <form id="feedbackForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Feedback" rows="4" required></textarea>
            <label for="rating">Rating:</label>
            <select id="rating" required>
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>
            <button type="submit">Submit Feedback</button>
        </form>

        <!-- Feedback Display Section -->
        <div class="feedback-list" id="feedbackList">
            <!-- Feedback items will be displayed here -->
        </div>
    </div>

    <script>
        // Function to display feedback and show acknowledgment
        function displayFeedback(name, email, message, rating) {
            const feedbackList = document.getElementById("feedbackList");
            const feedbackItem = document.createElement("div");
            feedbackItem.classList.add("feedback-item");
        
            feedbackItem.innerHTML = `
                <h3>${name}</h3>
                <p><strong>Email:</strong> ${email}</p>
                <p>${message}</p>
                <p class="rating">Rating: ${rating}</p>
            `;
            feedbackList.appendChild(feedbackItem);
    
            alert('Thank you for your feedback!');
        }
        
    
        // Submit feedback form
        document.getElementById("feedbackForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default form submission
    
            // Collect form data
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;
            const rating = document.getElementById("rating").value;
    
            // Send data to the backend
            fetch('http://localhost:3000/submit-feedback', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, email, message, rating })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayFeedback(name, email, message, rating); // Update UI
                    document.getElementById("feedbackForm").reset(); // Clear form
                } else {
                    alert('Failed to submit feedback. Please try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            });
        });
    </script>
    
</body>
</html>
