<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        /* Main container styling */
        .container {
            width: 95%;
            max-width: 800px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        /* Page title styling */
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        /* Subheading text */
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        /* Feedback display styling */
        .feedback-list {
            text-align: left;
            margin-top: 20px;
        }

        .feedback-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .feedback-item h3 {
            margin: 0 0 5px;
            color: #4cb54f;
        }

        .feedback-item p {
            margin: 5px 0;
            color: #555;
        }

        .feedback-item .rating {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Customer Feedback</h1>
        <p>Read what our customers have to say about our services.</p>

        <!-- Feedback Display Section -->
        <div class="feedback-list" id="feedbackList">
            <!-- Feedback items will be displayed here -->
        </div>
    </div>

    <script>
        // Simulated feedback data
        const feedbackData = [
            {
                name: 'Alice Johnson',
                email: 'alice@example.com',
                message: 'Amazing service! The staff was very friendly and professional.',
                rating: 5
            },
            {
                name: 'Bob Brown',
                email: 'bob@example.com',
                message: 'Had a great experience. The doctor was knowledgeable and caring.',
                rating: 4
            },
            {
                name: 'Charlie Davis',
                email: 'charlie@example.com',
                message: 'Overall good, but the wait time was a bit long.',
                rating: 3
            },
            {
                name: 'Dana White',
                email: 'dana@example.com',
                message: 'The staff was helpful, but the facilities could be improved.',
                rating: 3
            },
            {
                name: 'Eli Black',
                email: 'eli@example.com',
                message: 'Fantastic experience. Highly recommended!',
                rating: 5
            }
        ];

        // Function to display feedback
        function displayFeedback() {
            const feedbackList = document.getElementById("feedbackList");
            feedbackList.innerHTML = ""; // Clear existing content

            // Loop through each feedback item and create a display card
            feedbackData.forEach(feedback => {
                const feedbackItem = document.createElement("div");
                feedbackItem.classList.add("feedback-item");

                feedbackItem.innerHTML = `
                    <h3>${feedback.name}</h3>
                    <p><strong>Email:</strong> ${feedback.email}</p>
                    <p>${feedback.message}</p>
                    <p class="rating">Rating: ${feedback.rating} / 5</p>
                `;

                feedbackList.appendChild(feedbackItem);
            });
        }

        // Display feedback on page load
        window.onload = displayFeedback;
    </script>
</body>
</html>
