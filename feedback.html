<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to top,rgba(179, 195, 239, 0) 10%, rgba(146, 156, 240, 0) 10%), url(hospital.jpg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        /* Main container styling */
        .container {
            width: 95%;
            max-width: 800px;
            padding: 30px;
            background-color: #7869ae;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            text-align: center;
            margin-left: 200px;
        }

        /* Page title styling */
        h1 {
            color: #150334;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        /* Subheading text */
        p {
            font-size: 16px;
            color: #1f0334;
            margin-bottom: 30px;
        }

        /* Feedback display styling */
        .feedback-list {
            text-align: left;
            margin-top: 20px;
        }

        .feedback-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .feedback-item h3 {
            margin: 0 0 5px;
            color: #09043b;
        }

        .feedback-item p {
            margin: 5px 0;
            color: #18043f;
        }

        .feedback-item .rating {
            font-weight: bold;
            color: #16053e;
        }

        *{
            margin:0;
            padding: 0;
}
.main{
    width: 100%;
    background: linear-gradient(to top,rgba(179, 195, 239, 0) 10%, rgba(146, 156, 240, 0) 10%), url(hospital.jpg);
    background-position: center;
    background-size: cover;
    height: 109vh;
}
.navbar{
    width: 1200px;
    height:75px;
    margin:auto;
}
.icon{
    width: 200px;
    float:left;
    height: 70px;
}
.logo{
    color: rgb(7, 7, 51);
    font-size:35px;
    font-family:Arial, Helvetica, sans-serif;
    padding-left: 20px;
    float: left;
    padding-top: 10px;
}
.menu{
    width: 400px;
    float: left;
    height:70px;

}
ul{
    float: left;
    display:flex;
    justify-content: center;
    align-items: center;
}
ul li{
    list-style: none;
    margin-left: 62px;
    margin-top: 27px;
    font-size: 14px;
}
ul li a{
    text-decoration: none;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    transition: 0.4s ease-in-out;
}

ul li a:hover{
    color: blueviolet;
}
.search{
    width: 330px;
    float: left;
    margin-left: 270px;

}
.srch{
    font-family: 'Times New Roman', Times, serif;
    width: 200px;
    height: 40px;
    background: transparent;
    border: 1px solid rgb(244, 244, 250);
    margin-top: 13px;
    color:white;
    border-right: none ;
    font-size: 16px;
    float: left;
    padding: 10px;
    border-bottom-left-radius: 5px;
    border-top-left-radius: 5px;
}
.btn{
    width:100px;
    height: 40px;
    background: rgb(180, 214, 240);
    border: 2px solid  rgb(180, 214, 240);
    margin-top: 13px;
    color: white;
    font-size: 15px;
    border-bottom-right-radius: 5px;
    border-bottom-right-radius: 5px;

}

.btn:focus{
    outline: none;
}
.srch:focus{
    outline:none;
}
</style>
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="icon">
                <h2 class="logo">MyHospital</h2>
            </div>

            <div class="menu">
                <ul>
                    <li><a href="homepage.html">Home</a></li>
                    <li><a href="aboutpage.html">About</a></li>
                    <li><a href="feedback.html">Contact</a></li>
                </ul>
            </div>
            <div class="search">
                <input class="srch" type="search" name="" placeholder="Type">
                <a href="#"> <button class="btn">Search</button></a>
            </div>
        </div>
    <div class="container">
        <h1>Customer Feedback</h1>
        <p>Read what our customers have to say about our services.</p>

        <!-- Feedback Display Section -->
        <div class="feedback-list" id="feedbackList">
            <!-- Feedback items will be displayed here -->
        </div>
    </div>

    <script>
        // Simulated feedback data
        const feedbackData = [
            {
                name: 'Alice Johnson',
                email: 'alice@example.com',
                message: 'Amazing service! The staff was very friendly and professional.',
                rating: 5
            },
            {
                name: 'Bob Brown',
                email: 'bob@example.com',
                message: 'Had a great experience. The doctor was knowledgeable and caring.',
                rating: 4
            },
            {
                name: 'Charlie Davis',
                email: 'charlie@example.com',
                message: 'Overall good, but the wait time was a bit long.',
                rating: 3
            },
            {
                name: 'Dana White',
                email: 'dana@example.com',
                message: 'The staff was helpful, but the facilities could be improved.',
                rating: 3
            },
            {
                name: 'Eli Black',
                email: 'eli@example.com',
                message: 'Fantastic experience. Highly recommended!',
                rating: 5
            }
        ];

        // Function to display feedback
        function displayFeedback() {
            const feedbackList = document.getElementById("feedbackList");
            feedbackList.innerHTML = ""; // Clear existing content

            // Loop through each feedback item and create a display card
            feedbackData.forEach(feedback => {
                const feedbackItem = document.createElement("div");
                feedbackItem.classList.add("feedback-item");

                feedbackItem.innerHTML = `
                    <h3>${feedback.name}</h3>
                    <p><strong>Email:</strong> ${feedback.email}</p>
                    <p>${feedback.message}</p>
                    <p class="rating">Rating: ${feedback.rating} / 5</p>
                `;

                feedbackList.appendChild(feedbackItem);
            });
        }

        // Display feedback on page load
        window.onload = displayFeedback;
    </script>
</body>
</html>
