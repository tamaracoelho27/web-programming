<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment</title>
  <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Main Container */
.main {
    width: 100%;
    height: 100vh;
    background: linear-gradient(to top, rgba(179, 195, 239, 0.023), rgba(146, 155, 240, 0.014)),
        url(hospital.jpg) no-repeat center center;
    background-size: cover;
}

/* Navbar Styling */
.navbar {
    width: 1200px;
    height: 75px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.icon h2.logo {
    color: #070733;
    font-size: 35px;
    font-family: Arial, Helvetica, sans-serif;
}

/* Navigation Menu */
.menu ul {
    list-style: none;
    display: flex;
    gap: 40px;
}

.menu ul li a {
    text-decoration: none;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    transition: color 0.4s ease-in-out;
}

.menu ul li a:hover {
    color: blueviolet;
}

/* Search Box */
.search {
    display: flex;
    align-items: center;
    gap: 5px;
}

.srch {
    font-family: "Times New Roman", Times, serif;
    width: 200px;
    height: 40px;
    background: transparent;
    border: 1px solid rgb(244, 244, 250);
    color: white;
    padding: 0 10px;
    border-radius: 5px 0 0 5px;
}

.btn {
    width: 100px;
    height: 40px;
    background: rgb(180, 214, 240);
    border: 2px solid rgb(180, 214, 240);
    color: white;
    font-size: 15px;
    border-radius: 0 5px 5px 0;
    cursor: pointer;
}

.btn:hover {
    background: rgb(140, 194, 220);
}

/* Appointment Form Box */
#mybox {
    background-color: rgba(176, 143, 207, 0.9);
    border-radius: 20px;
    width: 600px;
    margin: 50px auto;
    padding: 30px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    color: white;
    font-family: Arial, sans-serif;
}

#mybox h1,
#mybox h3 {
    margin-bottom: 20px;
    text-align: center;
}

label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

select {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    font-size: 16px;
    border-radius: 5px;
    border: 1px solid #e49df2;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background-color: rgb(118, 1, 150);
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: rgb(45, 6, 71);
}

/* Timetable Styling */
#timetable {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: rgb(116, 116, 228)
}

#timetable th,
#timetable td {
    padding: 10px;
    text-align: center;
    border: 3px solid rgb(106, 54, 190);
}

#timetable th {
    background: #441361;
    color: white;
    font-size: 16px;
}

#timetable tr:nth-child(even) {
    background: rgb(116, 116, 228)
}

#timetable tr:hover {
    background: lightblue;
    cursor: pointer;
}

#timetable tr.selected {
    background-color: #2196f3;
    color: white;
}


  </style>
    
</head>
<body>
  <div class="main">
    <div class="navbar">
        <div class="icon">
            <h2 class="logo">MyHospital</h2>
        </div>

        <div class="menu">
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="aboutpage.html">About</a></li>
            </ul>
        </div>
    </div>

  <!-- Department selection dropdown -->
  <div id="mybox">
  <label for="selectDepartment">Select Department:</label>
  <select id="selectDepartment" onchange="populateDoctors()">
    <option value="">-- Select a Department --</option>
    <option value="General Practitioner">General Practitioner</option>
    <option value="Pediatrician">Pediatrician</option>
    <option value="Dermatologist">Dermatologist</option>
    <option value="General Surgeon">General Surgeon</option>
  </select>

  <!-- Doctor selection dropdown -->
  <label for="selectDoctor">Select Doctor:</label>
  <select id="selectDoctor">
    <option value="">-- Select a Doctor --</option>
  </select>

  <!-- Available timetable (Booking Appointment) -->
  <h3>Available Timetable:</h3>
  <table id="timetable">
    <thead>
      <tr>
        <th>Day</th>
        <th>Time Slot</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <!-- Timetable rows will be inserted here dynamically -->
    </tbody>
  </table>

  <button id="bookAppointment" onclick="bookAppointment()">Book Appointment</button>
  <button id="cancelAppointment" onclick="cancelAppointment()">Cancel Appointment</button>
  </div>
  <script>
    // Function to populate doctors based on selected department
    async function populateDoctors() {
  const department = document.getElementById("selectDepartment").value;
  const selectDoctor = document.getElementById("selectDoctor");

  if (!department) {
    alert("Please select a department.");
    return;
  }

  selectDoctor.innerHTML = "<option value=''>-- Select a Doctor --</option>";

  try {
    const response = await fetch(`http://localhost:3003/doctors?specialty=${encodeURIComponent(department)}`);
    const doctors = await response.json();

    if (doctors.length === 0) {
      alert("No doctors available for this department.");
      return;
    }

    doctors.forEach((doctor) => {
      const option = document.createElement("option");
      option.value = doctor.doctorID;
      option.textContent = `${doctor.doctorName} - ${doctor.doctorSpecialty}`;
      selectDoctor.appendChild(option);
    });
  } catch (error) {
    console.error("Error loading doctors:", error);
    alert("An error occurred while loading doctors. Please try again.");
  }
}


    // Function to populate the timetable based on selected doctor
    async function populateTimetable() {
  const doctorID = document.getElementById("selectDoctor").value;
  const timetableBody = document.getElementById("timetable").querySelector("tbody");

  if (!doctorID) {
    alert("Please select a doctor.");
    return;
  }

  timetableBody.innerHTML = "";

  try {
    const response = await fetch(`http://localhost:3003/doctors/${doctorID}/schedule`);
    const schedule = await response.json();

    if (!schedule || schedule.length === 0) {
      alert("No schedule available for this doctor.");
      return;
    }

    schedule.forEach((slot) => {
      const row = timetableBody.insertRow();
      row.innerHTML = `
        <td>${slot.day}</td>
        <td>${slot.time_slot}</td>
        <td>${slot.status}</td>
      `;
      row.dataset.slotId = slot.scheduleID;
    });
  } catch (error) {
    console.error("Error loading timetable:", error);
    alert("An error occurred while loading the timetable.");
  }
}


    // Function to handle the appointment booking
    function bookAppointment() {
  const doctorID = document.getElementById("selectDoctor").value;
  const timetable = document.getElementById("timetable");
  const selectedRow = timetable.querySelector("tr.selected");

  if (!doctorID || !selectedRow) {
    alert("Please select a doctor and time slot.");
    return;
  }

  const day = selectedRow.cells[0].textContent;
  const timeSlot = selectedRow.cells[1].textContent;
  const scheduleID = selectedRow.getAttribute("data-slot-id");

  // Update status in the database
  fetch(`http://localhost:3003/doctors/schedule/book`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      scheduleID: scheduleID,  // Sending scheduleID to update status
      status: 'unavailable'    // Set status to unavailable
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.message) {
      alert(`Appointment booked for Dr. ${doctorID} on ${day} at ${timeSlot}`);
      selectedRow.cells[2].textContent = 'unavailable';  // Update status in the table
    }
  })
  .catch(error => console.error('Error booking appointment:', error));
}


    // Function to handle appointment cancellation
    function cancelAppointment() {
      const timetable = document.getElementById("timetable");
      const selectedRow = timetable.querySelector("tr.selected");

      if (!selectedRow) {
        alert("Please select a time slot to cancel.");
        return;
      }

      const scheduleID = selectedRow.getAttribute("data-slot-id");

      // Revert the status to available in the database
      fetch(`http://localhost:3003/doctors/schedule/cancel`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          scheduleID: scheduleID,
          status: 'available'
        })
      })
      .then(response => response.json())
      .then(data => {
        alert(`Appointment for Dr. ${selectedRow.cells[0].textContent} on ${selectedRow.cells[1].textContent} cancelled.`);
        selectedRow.cells[2].textContent = 'available';  // Revert status in the table
      })
      .catch(error => console.error('Error cancelling appointment:', error));
    }

    // Add click event to select a timetable row
    document.getElementById("timetable").addEventListener("click", (e) => {
      const row = e.target.closest("tr");

      if (row && row.cells.length) {
        const selectedRow = document.querySelector("tr.selected");
        if (selectedRow) selectedRow.classList.remove("selected");
        row.classList.add("selected");
      }
    });

    // Call populateTimetable when a doctor is selected
    document.getElementById("selectDoctor").addEventListener("change", populateTimetable);

  </script>

</body>
</html>
