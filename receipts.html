<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipts</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Main container styling */
        .container {
            width: 95%;
            max-width: 1200px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        /* Page title styling */
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        /* Subheading text */
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        /* Responsive table styling */
        .receipts-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
        }

        /* Table header styling */
        th {
            background-color: #4cb54f;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }

        /* Table cell styling */
        td {
            padding: 15px;
            text-align: left;
            color: #555;
        }

        /* Alternating row colors */
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:nth-child(odd) {
            background-color: #ffffff;
        }

        /* Hover effect for table rows */
        tr:hover {
            background-color: #e2f3e8;
            transition: background-color 0.3s ease;
        }

        /* Media query for smaller screens */
        @media (max-width: 768px) {
            h1 {
                font-size: 24px;
            }
            th, td {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Receipts</h1>
        <p>Below is the list of recent transactions and services provided.</p>
        <div class="receipts-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Patient Name</th>
                        <th>Doctor Name</th>
                        <th>Service</th>
                        <th>Total Amount</th>
                    </tr>
                </thead>
                <tbody id="receiptsTableBody">
                    <!-- Receipt rows will be generated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Simulated receipt data
        const receipts = [
            { date: '2024-11-01', patientName: 'Alice Johnson', doctorName: 'Dr. Smith', service: 'Consultation', totalAmount: '$150' },
            { date: '2024-11-03', patientName: 'Bob Brown', doctorName: 'Dr. Doe', service: 'X-ray', totalAmount: '$200' },
            { date: '2024-11-05', patientName: 'Charlie Davis', doctorName: 'Dr. Green', service: 'Blood Test', totalAmount: '$80' },
            { date: '2024-11-07', patientName: 'Dana White', doctorName: 'Dr. Smith', service: 'MRI', totalAmount: '$600' },
            { date: '2024-11-09', patientName: 'Eli Black', doctorName: 'Dr. Lee', service: 'Vaccination', totalAmount: '$50' }
        ];

        // Function to display receipts in the table
        function displayReceipts() {
            const receiptsTableBody = document.getElementById("receiptsTableBody");
            receiptsTableBody.innerHTML = ""; // Clear existing content

            // Loop through each receipt and create a row in the table
            receipts.forEach(receipt => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${receipt.date}</td>
                    <td>${receipt.patientName}</td>
                    <td>${receipt.doctorName}</td>
                    <td>${receipt.service}</td>
                    <td>${receipt.totalAmount}</td>
                `;
                receiptsTableBody.appendChild(row);
            });
        }

        // Display receipts when the page loads
        window.onload = displayReceipts;
    </script>
</body>
</html>
