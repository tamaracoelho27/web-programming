<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login Page</title>
  <link rel="stylesheet" href="login.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <script>
    async function handleAdminLogin(event) {
      event.preventDefault(); // Prevent the default form submission
  
      const username = document.querySelector("input[placeholder='Username']").value.trim();
      const password = document.querySelector("input[placeholder='Password']").value.trim();
      const adminPin = document.querySelector("input[placeholder='Admin Pin']").value.trim();
  
      try {
        console.log("Sending login request..."); // Debug log
        const response = await fetch('http://localhost:3000/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, pin: adminPin }) // Ensure correct key for pin
        });
  
        const result = await response.json();
        console.log("Response from server:", result); // Debug log
  
        if (response.ok) {
          alert('Login successful!');
          window.location.href = "adminhomepage.html"; // Redirect to Admin HP page
        } else {
          alert(result.message || 'Login failed. Please try again.');
        }
      } catch (error) {
        console.error("Error during login:", error); // Debug log
        alert("An error occurred. Please check your connection and try again.");
      }
    }
  </script>
  
</head>
<body>
  <div class="wrapper">
    <form class="login-form" onsubmit="handleAdminLogin(event)">
      <h1>Login</h1>
      <div class="input-box">
        <input type="text" placeholder="Username" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Admin Pin" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
  </div>
</body>
</html>
