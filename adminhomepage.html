<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Staff Homepage</title>
    <link rel="stylesheet" href="adminhomepage.css">
    <script>
        // Function to open new window based on panel clicked
        function openNewWindow(panel) {
            if (panel === 'schedule') {
                window.open('booking.html', '_blank'); // Opens the Doctor Schedules page in a new window
            } else if (panel === 'modify') {
                window.open('modify.html', '_blank'); // Opens the Modify Doctor Details page in a new window
            }  // Opens the View Receipts page in a new window
        }
    </script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Hospital Staff Dashboard</h1>
        </header>

        <nav>
            <ul>
                <li><a href="doctors.html">Doctor Schedules</a></li>
                <li><a href="modify.html">Modify Doctor Details</a></li>
            </ul>
        </nav>

        <section class="dashboard">
            <div class="card" id="schedule" onclick="openNewWindow('schedule')">
                <h2>Doctor Schedules</h2>
                <p>Access and manage doctor availability and appointments.</p>
            </div>

            <div class="card" id="modify" onclick="openNewWindow('modify')">
                <h2>Modify Doctor Details</h2>
                <p>Edit and update doctor profiles and specialisations.</p>
            </div>

        </section>

        <footer>
            <p>&copy; F28WP GROUP 14 </p>
        </footer>
    </div>

</body>
</html>
